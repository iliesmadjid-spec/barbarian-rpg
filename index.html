// ═══════════════════════════════════════════════════════════════════════════════
// SOUND ENGINE v4 — ambiance cave réaliste : reverb, vent, gouttes, grondement
// ═══════════════════════════════════════════════════════════════════════════════
class SoundEngine {
  constructor(){ this.ctx=null; this.master=null; this.reverb=null; this.reverbDry=null; this.nodes=[]; this.curMode=null; }

  _init(){
    if(this.ctx){ if(this.ctx.state==="suspended") this.ctx.resume(); return; }
    this.ctx = new(window.AudioContext||window.webkitAudioContext)();
    if(this.ctx.state==="suspended") this.ctx.resume();

    // Compresseur master pour éviter la saturation
    const comp = this.ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.knee.value=8;
    comp.ratio.value=4; comp.attack.value=0.01; comp.release.value=0.2;
    this.master = this.ctx.createGain(); this.master.gain.value=0.6;
    this.master.connect(comp); comp.connect(this.ctx.destination);

    // Reverb longue — simule l'écho d'une grotte
    const rate=this.ctx.sampleRate;
    const len=rate*3.5;
    const ibuf=this.ctx.createBuffer(2,len,rate);
    for(let ch=0;ch<2;ch++){
      const d=ibuf.getChannelData(ch);
      for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.5);
    }
    this.reverb=this.ctx.createConvolver(); this.reverb.buffer=ibuf;
    const rvGain=this.ctx.createGain(); rvGain.gain.value=0.45;
    this.reverb.connect(rvGain); rvGain.connect(this.master);

    // Signal sec (dry) direct
    this.reverbDry=this.ctx.createGain(); this.reverbDry.gain.value=0.55;
    this.reverbDry.connect(this.master);
  }

  stop(){
    this.nodes.forEach(n=>{try{n.stop&&n.stop();n.disconnect&&n.disconnect();}catch{}});
    this.nodes=[];
  }

  // ── GRONDEMENT SOUTERRAIN ── bruit rose grave très filtré
  _rumble(vol=0.08){
    const c=this.ctx;
    const buf=c.createBuffer(1,c.sampleRate*4,c.sampleRate);
    const d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp1=c.createBiquadFilter(); lp1.type="lowpass"; lp1.frequency.value=80;
    const lp2=c.createBiquadFilter(); lp2.type="lowpass"; lp2.frequency.value=60;
    // LFO lent sur le volume — le grondement respire
    const lfo=c.createOscillator(); const lfoG=c.createGain();
    const g=c.createGain();
    lfo.frequency.value=0.07; lfoG.gain.value=vol*0.3; g.gain.value=vol;
    lfo.connect(lfoG); lfoG.connect(g.gain);
    src.connect(lp1); lp1.connect(lp2); lp2.connect(g);
    g.connect(this.reverbDry); g.connect(this.reverb);
    src.start(); lfo.start();
    this.nodes.push(src,lp1,lp2,lfo,lfoG,g);
  }

  // ── VENT DE COULOIR ── bruit filtré bandpass qui monte et descend
  _wind(vol=0.05){
    const c=this.ctx;
    // Deux couches de bruit pour donner de la texture
    [280,480].forEach((freq,i)=>{
      const buf=c.createBuffer(1,c.sampleRate*5,c.sampleRate);
      const d=buf.getChannelData(0); for(let j=0;j<d.length;j++) d[j]=Math.random()*2-1;
      const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
      const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=freq; bp.Q.value=i===0?1.2:2.0;
      const lfo=c.createOscillator(); const lfoG=c.createGain();
      const g=c.createGain();
      lfo.frequency.value=0.04+i*0.02; lfoG.gain.value=vol*0.5; g.gain.value=vol*(i===0?1:0.4);
      lfo.connect(lfoG); lfoG.connect(g.gain);
      src.connect(bp); bp.connect(g); g.connect(this.reverbDry);
      src.start(); lfo.start();
      this.nodes.push(src,bp,lfo,lfoG,g);
    });
  }

  // ── GOUTTES D'EAU ── son réaliste : impact + résonance + écho
  _drips(minDelay=3000,maxDelay=12000){
    const c=this.ctx;
    const schedDrip=()=>{
      const delay=minDelay+Math.random()*(maxDelay-minDelay);
      const t=setTimeout(()=>{
        if(!this.ctx||!this.curMode) return;
        const now=c.currentTime;
        // Impact initial — click court
        const clickOsc=c.createOscillator(); const clickG=c.createGain();
        const f=500+Math.random()*800;
        clickOsc.type="sine"; clickOsc.frequency.setValueAtTime(f,now);
        clickOsc.frequency.exponentialRampToValueAtTime(f*0.15,now+0.04);
        clickG.gain.setValueAtTime(0,now);
        clickG.gain.linearRampToValueAtTime(0.18,now+0.003);
        clickG.gain.exponentialRampToValueAtTime(0.001,now+0.05);
        clickOsc.connect(clickG); clickG.connect(this.reverb); clickG.connect(this.reverbDry);
        clickOsc.start(now); clickOsc.stop(now+0.06);
        // Résonance de la cavité — sine plus grave qui dure un peu
        const resOsc=c.createOscillator(); const resG=c.createGain();
        resOsc.type="sine"; resOsc.frequency.value=f*0.3;
        resG.gain.setValueAtTime(0.06,now+0.005);
        resG.gain.exponentialRampToValueAtTime(0.001,now+0.35);
        resOsc.connect(resG); resG.connect(this.reverb);
        resOsc.start(now+0.005); resOsc.stop(now+0.38);
        schedDrip();
      },delay);
      this.nodes.push({stop:()=>clearTimeout(t)});
    };
    // 2-3 sources décalées — IDs trackés pour pouvoir les arrêter
    schedDrip();
    const t2=setTimeout(schedDrip, 1500+Math.random()*2000);
    const t3=setTimeout(schedDrip, 4000+Math.random()*3000);
    this.nodes.push({stop:()=>clearTimeout(t2)},{stop:()=>clearTimeout(t3)});
  }

  // ── DRONE TONAL ── pour renforcer l'atmosphère
  _drone(freq,vol,fadeSec=2){
    const c=this.ctx;
    const osc=c.createOscillator(); const g=c.createGain();
    osc.type="sine"; osc.frequency.value=freq;
    g.gain.setValueAtTime(0,c.currentTime);
    g.gain.linearRampToValueAtTime(vol,c.currentTime+fadeSec);
    osc.connect(g); g.connect(this.reverb); g.connect(this.reverbDry);
    osc.start(); this.nodes.push(osc,g);
  }

  // ── TENSION COMBAT ── battement de fréquence + distorsion
  _combatTension(){
    const c=this.ctx;
    // Deux oscillateurs proches créent un battement naturel (7Hz = tension)
    [[116,0.08],[123,0.07]].forEach(([f,v])=>{
      const osc=c.createOscillator(); const g=c.createGain();
      const wave=c.createBiquadFilter(); wave.type="lowpass"; wave.frequency.value=400;
      osc.type="sawtooth"; osc.frequency.value=f;
      g.gain.setValueAtTime(0,c.currentTime);
      g.gain.linearRampToValueAtTime(v,c.currentTime+0.8);
      osc.connect(wave); wave.connect(g); g.connect(this.reverbDry);
      osc.start(); this.nodes.push(osc,wave,g);
    });
    // Bruit de friction grave — métal contre pierre
    const nBuf=c.createBuffer(1,c.sampleRate*2,c.sampleRate);
    const nd=nBuf.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    const nSrc=c.createBufferSource(); nSrc.buffer=nBuf; nSrc.loop=true;
    const nFilt=c.createBiquadFilter(); nFilt.type="bandpass"; nFilt.frequency.value=180; nFilt.Q.value=0.8;
    const nG=c.createGain(); nG.gain.value=0.04;
    nSrc.connect(nFilt); nFilt.connect(nG); nG.connect(this.reverbDry);
    nSrc.start(); this.nodes.push(nSrc,nFilt,nG);
  }

  // ── BATTEMENT CARDIAQUE ── pour danger/mort imminente
  _heartbeat(bpm=72){
    const c=this.ctx;
    const interval=60000/bpm;
    const beat=()=>{
      if(!this.ctx||!this.curMode) return;
      const now=c.currentTime;
      // Deux coups (lub-dub)
      [[now,0.12],[now+0.18,0.08]].forEach(([t,v])=>{
        const o=c.createOscillator(); const g=c.createGain();
        o.type="sine"; o.frequency.setValueAtTime(65,t);
        o.frequency.exponentialRampToValueAtTime(30,t+0.12);
        g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
        o.connect(g); g.connect(this.reverbDry);
        o.start(t); o.stop(t+0.18);
      });
    };
    beat();
    const id=setInterval(beat,interval);
    this.nodes.push({stop:()=>clearInterval(id)});
  }

  // ── LECTURE PAR MODE ─────────────────────────────────────────────────────────
  play(mode, hpPct=1){
    if(mode===this.curMode) return;
    this.stop(); this.curMode=mode;
    const critical=hpPct<0.25;

    if(mode==="explore"){
      this._rumble(0.09);                   // grondement souterrain
      this._wind(0.04);                     // vent de couloir
      this._drips(3000,12000);              // gouttes lentes
      this._drone(97,0.025,3);             // drone très discret
      if(critical){ this._drone(65,0.05,1); this._heartbeat(90); }
    }
    else if(mode==="combat"){
      this._rumble(0.12);                   // grondement fort
      this._combatTension();                // battement de fréquence
      this._drips(8000,20000);              // gouttes rares (combat actif)
      if(critical){ this._heartbeat(110); this._drone(55,0.07,0.5); }
    }
    else if(mode==="rest"){
      this._rumble(0.05);                   // grondement très doux
      this._drips(2000,7000);              // gouttes fréquentes au repos
      this._drone(130,0.02,4);             // ton apaisant
    }
    else if(mode==="danger"){
      this._rumble(0.14);                   // grondement intense
      this._wind(0.07);                     // vent fort
      this._heartbeat(105);                 // cœur rapide
      this._drone(55,0.08,0.5);
    }
    else if(mode==="dead"){
      this._drone(55,0.10,3);
      this._drone(82,0.06,4);
      this._rumble(0.06);
    }
  }

  setMode(mode,hp=100,hpMax=100){ this.play(mode,hp/hpMax); }
  init(){ this._init(); }
}
const SE = new SoundEngine();

// HELPERS

function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v));}

// ── SYSTÈME DE POIDS ──────────────────────────────────────────────
const WEIGHT_DEFAULTS={
  weapon:3.5, armor:6.0, consumable:0.5,
  food:0.3,   water:0.5, misc:1.0
};
// Capacité max en kg : base 10 + FOR*2 (utilise le FOR brut, sans malus)
function maxCarry(forStat){ return 10 + (forStat||14)*2; }
// Poids total de l'inventaire
function calcWeight(inventory){
  if(!inventory||!inventory.length) return 0;
  return inventory.reduce((sum,i)=>{
    const w = typeof i.weight==="number" ? i.weight : (WEIGHT_DEFAULTS[i.type]||1.0);
    return sum + w*(i.qty||1);
  },0);
}
// Normaliser un item (ajouter weight si manquant)
function normalizeItem(item){
  if(typeof item.weight==="number") return item;
  return {...item, weight: WEIGHT_DEFAULTS[item.type||"misc"]||1.0};
}

// ── SYSTÈME DE DÉS ET DÉGÂTS CLIENT-SIDE ─────────────────────────
function rollD100(){ return Math.floor(Math.random()*100)+1; }

function calcCombatDamage(roll, forStat, currentEnemyHp){
  // Dégâts de Bjorn sur l'ennemi
  let enemyDmg=0, playerDmg=0;
  const base = Math.max(1, Math.floor(forStat*0.6));
  if(roll>=80){
    // CRITIQUE : frappe puissante, quasi pas de riposte
    enemyDmg = base + Math.floor(Math.random()*8) + 8;
    playerDmg = Math.floor(Math.random()*4);
  } else if(roll>=51){
    // SUCCÈS : échange standard
    enemyDmg = base + Math.floor(Math.random()*5);
    playerDmg = Math.floor(3 + Math.random()*9);
  } else if(roll>=21){
    // ÉCHEC : Bjorn rate, l'ennemi contre-attaque
    enemyDmg = 0;
    playerDmg = Math.floor(7 + Math.random()*11);
  } else {
    // DÉSASTRE : coup dévastateur reçu
    enemyDmg = 0;
    playerDmg = Math.floor(14 + Math.random()*14);
  }
  // L'ennemi ne peut pas descendre sous 0
  const newEnemyHp = Math.max(0, currentEnemyHp - enemyDmg);
  return { enemyDmg, playerDmg: -playerDmg, newEnemyHp };
}

function getSurvivalMalus(char){
  let forMod=0,agiMod=0,endMod=0,hpDrain=0,staDrain=0;
  // FAIM — drains réduits
  if(char.hunger<=0){forMod-=10;endMod-=8;hpDrain+=3;staDrain+=8;}
  else if(char.hunger<20){forMod-=6;endMod-=4;staDrain+=5;}
  else if(char.hunger<40){forMod-=3;endMod-=2;}
  else if(char.hunger<60){forMod-=1;}
  // SOIF — drains réduits
  if(char.thirst<=0){agiMod-=10;hpDrain+=5;staDrain+=12;}
  else if(char.thirst<20){agiMod-=5;staDrain+=6;}
  else if(char.thirst<40){agiMod-=2;}
  // TEMPÉRATURE
  if(char.temp<0){hpDrain+=4;staDrain+=6;}
  else if(char.temp<5){hpDrain+=2;staDrain+=3;}
  else if(char.temp>40){hpDrain+=3;staDrain+=4;}
  else if(char.temp>35){staDrain+=3;}
  // ENDURANCE FAIBLE — malus physique
  if(char.stamina<=0){forMod-=12;agiMod-=12;}
  else if(char.stamina/char.staminaMax<0.2){forMod-=5;agiMod-=4;}
  // SURCHARGE — utilise FOR brut pour éviter la dépendance circulaire
  const rawFor = char.stats ? (char.stats.FOR||14) : 14;
  const totalW = calcWeight(char.inventory||[]);
  const maxW   = maxCarry(rawFor);
  const wRatio = maxW > 0 ? totalW/maxW : 0;
  if(wRatio > 1.0){forMod-=4; agiMod-=7; staDrain+=10;}
  else if(wRatio > 0.85){agiMod-=3; staDrain+=4;}
  return {forMod,agiMod,endMod,hpDrain,staDrain,totalW,maxW,wRatio};
}

  else if(char.hunger<40) warnings.push({text:"🍖 Affamé",color:"#cc6622"});
  else if(char.hunger<60) warnings.push({text:"🍖 Faim",color:"#aa7733"});
  if(char.thirst<=0)    warnings.push({text:"💀 DÉSHYDRATATION — PV en chute !",color:"#ff2222",blink:true});
  else if(char.thirst<20) warnings.push({text:"💀 Déshydratation critique",color:"#2299ff",blink:true});
  else if(char.thirst<40) warnings.push({text:"💧 Assoiffé",color:"#2277cc"});
  else if(char.thirst<60) warnings.push({text:"💧 Soif",color:"#2266aa"});
  if(char.temp<0)    warnings.push({text:"🥶 HYPOTHERMIE — PV en chute !",color:"#88ccff",blink:true});
  else if(char.temp<5)  warnings.push({text:"🥶 Gelé",color:"#66aaee"});
  else if(char.temp>40) warnings.push({text:"🔥 COUP DE CHALEUR — PV en chute !",color:"#ff8822",blink:true});
  else if(char.temp>35) warnings.push({text:"🔥 Surchauffé",color:"#ee6622"});
  // Stamina warning — ne pas doubler avec char.unconscious
  if(!char.unconscious && char.stamina<=0) warnings.push({text:"💤 Endurance à zéro !",color:"#aaaaff",blink:true});
  else if(char.stamina/char.staminaMax<0.2) warnings.push({text:"⚡ Épuisé — malus physique",color:"#4488cc"});
  // Surcharge
  const rawFor2 = char.stats ? (char.stats.FOR||14) : 14;
  const wRatio2 = maxCarry(rawFor2) > 0 ? calcWeight(char.inventory||[])/maxCarry(rawFor2) : 0;
  if(wRatio2 > 1.0) warnings.push({text:"⚖️ SURCHARGE — malus AGI/END !",color:"#ffaa22",blink:true});
  else if(wRatio2 > 0.85) warnings.push({text:"⚖️ Chargé",color:"#aa7722"});
  return warnings;
}

function StatBar({value,max,color,label,icon,warn=false}){
  const pct=Math.max(0,Math.min(100,(value/max)*100));
  const barColor = warn ? (pct<20?"#ff2222":pct<40?color+"cc":color) : color;
  return(
    <div style={{marginBottom:7}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#a89070",marginBottom:2}}>
        <span>{icon} {label}</span>
        <span style={{color:pct<25?"#ff4444":pct<50?"#ffaa44":"#d4b070"}}>{value}<span style={{color:"#5a3818"}}>/{max}</span></span>
      </div>
      <div style={{height:6,background:"#1a1208",borderRadius:3,overflow:"hidden",border:"1px solid #2a1a08"}}>
        <div style={{height:"100%",width:pct+"%",background:barColor,transition:"width 0.5s",borderRadius:3}}/>
      </div>
    </div>
  );
}

function TempBadge({temp}){
  const color = temp<0?"#88ccff":temp<5?"#66aadd":temp<10?"#99bbcc":temp>40?"#ff6622":temp>35?"#ff8844":temp>25?"#ffaa44":"#66aa88";
  const icon  = temp<5?"🥶":temp>35?"🔥":"🌡";
  return <span style={{fontSize:10,color,fontFamily:"'Cinzel',serif"}}>{icon} {temp}°C</span>;
}

const SAVE_KEY="stb_save_v3";
const APIKEY_KEY="stb_key";

// ═══════════════════════════════════════════════════════════════════════════════
// APP
// ═══════════════════════════════════════════════════════════════════════════════
const INIT_MSG=[{role:"assistant",text:"Les portes de pierre s'ouvrent dans un grondement sourd. Tu es Bjorn — mains nues, ventre vide, gorge sèche. Le donjon est glacial. Tu n'as rien. Personne ne t'aidera. Que fais-tu ?",roll:null}];

function hasSave(){ try{return !!localStorage.getItem(SAVE_KEY);}catch{return false;} }
function loadSave(){ try{const s=localStorage.getItem(SAVE_KEY);return s?JSON.parse(s):null;}catch{return null;} }

function App(){
  const [apiKey,setApiKey]=useState(localStorage.getItem(APIKEY_KEY)||"");
  const [keySet,setKeySet]=useState(!!localStorage.getItem(APIKEY_KEY));
  // screen: "start" | "game"
  const [screen,setScreen]=useState(()=> hasSave() && !!localStorage.getItem(APIKEY_KEY) ? "start" : "game");
  const [char,setChar]=useState(INITIAL_CHAR);
  const [messages,setMessages]=useState(INIT_MSG);
  const [input,setInput]=useState("");
  const [loading,setLoad]=useState(false);
  const [tab,setTab]=useState("journal");
  const [enemy,setEnemy]=useState(null);
  const [notif,setNotif]=useState(null);
  const [saveFlash,setSaveFlash]=useState(false);
  const [newSkill,setNewSkill]=useState(null);
  const [soundOn,setSoundOn]=useState(false);
  const soundOnRef=useRef(false);
  const [dead,setDead]=useState(false);
  const [unconscious,setUnconscious]=useState(()=>{ try{const s=localStorage.getItem("stb_save_v3");return s?JSON.parse(s).char?.unconscious||false:false;}catch{return false;} });
  const endRef=useRef(null);
  const history=useRef([]);
  const inputRef=useRef(null);
  const soundMode=useRef("explore");

  // ── SAUVEGARDE AUTO ──────────────────────────────────────────────────────────
  useEffect(()=>{
    if(!keySet||screen!=="game")return;
    // Ne sauvegarde que si la partie a vraiment commencé (au moins 1 message user)
    if(messages.length<2)return;
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({char,messages:messages.slice(-50),enemy,savedAt:Date.now()}));}catch{}
  },[char,messages,keySet,screen]);

  useEffect(()=>{if(tab==="journal")endRef.current?.scrollIntoView({behavior:"smooth"});},[messages,tab]);

  // ── DEATH / UNCONSCIOUS CHECK ───────────────────────────────────────────────
  useEffect(()=>{
    if(char.hp<=0&&!dead){
      setDead(true); setUnconscious(false);
      if(soundOnRef.current) SE.play("dead",0);
      setMessages(p=>[...p,{role:"assistant",text:"☠ BJORN EST MORT. La faim, la soif, le froid ou les coups ont eu raison de toi. Le donjon n'a aucune pitié. Recommence.",roll:null}]);
    }
  },[char.hp]);

  useEffect(()=>{
    if(char.unconscious && !unconscious){
      setUnconscious(true);
      if(soundOnRef.current) SE.play("danger",char.hp/char.hpMax);
      setMessages(p=>[...p,{role:"assistant",text:"⚠️ Bjorn s'effondre, à bout de forces. Il est inconscient. Ses yeux se ferment malgré lui...",roll:null}]);
    }
    if(!char.unconscious && unconscious) setUnconscious(false);
  },[char.unconscious]);

  // ── SON ──────────────────────────────────────────────────────────────────────
  const updateSound=(mode,hp,hpMax)=>{
    soundMode.current=mode;
    if(!soundOnRef.current) return;
    SE.play(mode, hp/hpMax);
  };

  const toggleSound=()=>{
    if(!soundOnRef.current){
      SE._init();
      SE.play(soundMode.current||"explore", char.hp/char.hpMax);
      soundOnRef.current=true; setSoundOn(true);
    } else {
      SE.stop(); SE.curMode=null;
      soundOnRef.current=false; setSoundOn(false);
    }
  };

  const showNotif=(text,color="#ffd700")=>{
    setNotif({text,color});
    setTimeout(()=>setNotif(null),2600);
  };

  const saveKey=()=>{localStorage.setItem(APIKEY_KEY,apiKey);setKeySet(true);};

  const manualSave=()=>{
    try{
      localStorage.setItem(SAVE_KEY,JSON.stringify({char,messages:messages.slice(-50),savedAt:Date.now()}));
      setSaveFlash(true); setTimeout(()=>setSaveFlash(false),1500);
      showNotif("💾 Sauvegardé !","#44aaff");
    }catch{showNotif("⚠️ Erreur save","#cc4444");}
  };

  const loadGame=()=>{
    const s=loadSave();
    if(!s){showNotif("Aucune sauvegarde !","#cc4444");return;}
    // Merge + normalisation des items sans weight (vieilles saves)
    const rawSaved = s.char||{};
    const savedChar={...INITIAL_CHAR,...rawSaved,
      inventory:(rawSaved.inventory||[]).map(normalizeItem)};
    setChar(savedChar);
    const savedMsgs=s.messages||INIT_MSG;
    setMessages(savedMsgs);
    // Reconstruire l'historique API — l'API exige user/assistant alternés, commençant par user
    const rawHistory = savedMsgs
      .filter(m=>m.text&&m.text.trim()&&!m.text.startsWith("⚠️")) // exclure messages d'erreur
      .slice(-12)
      .map(m=>({role:m.role==="assistant"?"assistant":"user", content:m.text.trim()}));
    // Supprimer les doublons de rôle consécutifs (garder le dernier)
    const dedupedHistory = [];
    for(const msg of rawHistory){
      if(dedupedHistory.length>0 && dedupedHistory[dedupedHistory.length-1].role===msg.role){
        dedupedHistory[dedupedHistory.length-1]=msg; // remplace le précédent même rôle
      } else {
        dedupedHistory.push(msg);
      }
    }
    // Doit commencer par "user" — sinon l'API rejette
    while(dedupedHistory.length>0 && dedupedHistory[0].role!=="user") dedupedHistory.shift();
    history.current = dedupedHistory;
    setDead(savedChar.hp<=0);
    setUnconscious(savedChar.unconscious||false);
    setEnemy(s.enemy||null);
    setScreen("game");
    showNotif("📂 Partie chargée","#44aaff");
  };

  const deleteSave=()=>{
    if(!window.confirm("Supprimer la sauvegarde définitivement ?")) return;
    localStorage.removeItem(SAVE_KEY);
    showNotif("🗑 Sauvegarde supprimée","#cc4444");
    setScreen("game");
    setChar(INITIAL_CHAR);
    setMessages(INIT_MSG);
    history.current=[];
    setDead(false); setUnconscious(false); setEnemy(null);
  };

  const resetGame=()=>{
    if(!window.confirm("Effacer la partie actuelle et recommencer ?"))return;
    localStorage.removeItem(SAVE_KEY);
    setChar(INITIAL_CHAR);
    setMessages(INIT_MSG);
    setEnemy(null); setDead(false); setUnconscious(false); history.current=[];
    setScreen("game");
    showNotif("🔄 Nouvelle partie","#c8862a");
    if(soundOnRef.current) SE.play("explore",1);
  };

  // ── DELTA APPLICATION ────────────────────────────────────────────────────────
  const applyDelta=useCallback((d,c0)=>{
    const c={...c0,stats:{...c0.stats},inventory:[...c0.inventory],skills:[...c0.skills]};

    // Stats vitales — on applique TOUJOURS même si 0
    c.hp      = clamp(c.hp      + (d.hpChange||0),      0, c.hpMax);
    c.stamina = clamp(c.stamina + (d.staminaChange||0),  0, c.staminaMax);
    c.rage    = clamp(c.rage    + (d.rageChange||0),     0, c.rageMax);
    if(d.goldChange) c.gold = Math.max(0,c.gold+d.goldChange);

    // SURVIE
    const hungerCost = (d.hungerChange !== undefined && d.hungerChange !== null) ? d.hungerChange : 0;
    const thirstCost = (d.thirstChange !== undefined && d.thirstChange !== null) ? d.thirstChange : 0;
    const tempDelta  = d.tempChange   !== undefined ? d.tempChange  : 0;
    c.hunger = clamp(c.hunger + hungerCost, 0, c.hungerMax);
    c.thirst = clamp(c.thirst + thirstCost, 0, c.thirstMax);
    c.temp   = clamp(c.temp   + tempDelta,  -20, 60);

    // Malus survie appliqués
    const mal=getSurvivalMalus(c);
    if(mal.hpDrain>0)   c.hp      =Math.max(0,c.hp-mal.hpDrain);
    if(mal.staDrain>0)  c.stamina =Math.max(0,c.stamina-mal.staDrain);

    // Loot — guard qty>0 + normalisation complète des champs + weight
    if(d.lootItem && d.lootItem.name){
      const lootQty  = Math.max(1, parseInt(d.lootItem.qty)||1);
      const lootType = d.lootItem.type||"misc";
      const lootW    = typeof d.lootItem.weight==="number" && d.lootItem.weight>0
                         ? d.lootItem.weight
                         : (WEIGHT_DEFAULTS[lootType]||1.0);
      const lootItem = { name:d.lootItem.name, type:lootType,
        icon:d.lootItem.icon||"📦", qty:lootQty, weight:lootW };
      const ex=c.inventory.find(i=>i.name===lootItem.name);
      if(ex) c.inventory=c.inventory.map(i=>i.name===lootItem.name?{...i,qty:i.qty+lootQty}:i);
      else   c.inventory=[...c.inventory, lootItem];
    }

    // XP / Level up
    if(d.xpGain){
      c.xp+=d.xpGain;
      if(c.xp>=c.xpNext){
        c.level++; c.xp-=c.xpNext; c.xpNext=Math.floor(c.xpNext*1.6);
        c.hpMax+=10; c.hp=Math.min(c.hpMax,c.hp+10);
        c.staminaMax+=6; c.stats.FOR+=1; c.stats.END+=1;
        const ns=ALL_SKILLS.filter(sk=>sk.unlockLv===c.level&&!c.skills.find(s=>s.id===sk.id));
        if(ns.length>0){c.skills=[...c.skills,...ns];setNewSkill(ns[0]);setTimeout(()=>setNewSkill(null),4000);}
        showNotif("⚔️ NIVEAU "+c.level+" ! +10 PV +1 FOR +1 END","#ffd700");
      }
    }
    if(d.locationChange) c.location=d.locationChange;

    // TEMPS — avancer heure/jour/mois
    const mins = (d.timeChange !== undefined && d.timeChange !== null) ? Math.max(1, Number(d.timeChange)||10) : 10;
    c._totalMins = (Number(c._totalMins)||360) + mins;
    const totalH = Math.floor(c._totalMins / 60);
    c.hour  = totalH % 24;
    c.day   = 1 + Math.floor(totalH / 24) % 30;
    c.month = 1 + Math.floor(totalH / (24*30));

    // INCONSCIENCE — stamina tombe à 0
    if(c.stamina<=0 && !c.unconscious) c.unconscious=true;
    if(c.unconscious && c.stamina>15)  c.unconscious=false;

    return c;
  },[]);

  // ── ENVOYER MESSAGE ──────────────────────────────────────────────────────────
  const send=async()=>{
    if(!input.trim()||loading||dead||char.unconscious)return;
    const txt=input.trim(); setInput(""); setLoad(true);
    setMessages(p=>[...p,{role:"user",text:txt}]);
    history.current.push({role:"user",content:txt});

    const mal=getSurvivalMalus(char);
    const inv=char.inventory.length>0?char.inventory.map(i=>(i.icon||"📦")+i.name+"["+(i.type||"misc")+"]×"+(i.qty||1)).join(", "):"AUCUN";
    const hh=String(char.hour).padStart(2,"0")+":00";
    const dateStr="Jour "+char.day+" Mois "+char.month+" | "+hh;

    // ── DÉ CLIENT-SIDE — injecté dans TOUTES les actions ──────────
    const inCombat = !!enemy;
    const clientRoll = rollD100();
    let clientDmg = null;
    if(inCombat){
      clientDmg = calcCombatDamage(clientRoll, char.stats.FOR + mal.forMod, enemy.hp);
    }
    const rollLabel = clientRoll>=80?"CRITIQUE":clientRoll<=20?"DÉSASTRE":clientRoll>=51?"SUCCÈS":"ÉCHEC";

    // Le dé est toujours injecté — Claude DOIT narrer selon ce résultat
    // rollCtx sans crochets propres (ctx lui ajoute le ] final)
    const rollInfo = `ROLL:${clientRoll}=${rollLabel}`;
    const combatCtx = inCombat
      ? ` | COMBAT vs ${enemy.name} (PV:${enemy.hp}/100) | ${rollInfo} | DmgEnnemi:${clientDmg.enemyDmg} | DmgBjorn:${-clientDmg.playerDmg} | HPennemiAprès:${clientDmg.newEnemyHp}`
      : ` | ${rollInfo}`;

    const weightStr = char.inventory.length>0 ? ` | Charge:${calcWeight(char.inventory).toFixed(1)}/${maxCarry(char.stats.FOR).toFixed(0)}kg` : "";
    const ctx=`[${dateStr} | PV:${char.hp}/${char.hpMax} END:${char.stamina}/${char.staminaMax} RAGE:${char.rage}/${char.rageMax} Or:${char.gold}g Nv:${char.level}${char.unconscious?" | INCONSCIENT":""}${weightStr} | Lieu:${char.location} | Faim:${char.hunger}% Soif:${char.thirst}% Temp:${char.temp}°C | FOR:${char.stats.FOR+mal.forMod} AGI:${char.stats.AGI+mal.agiMod} | Inventaire:${inv}${combatCtx}]`;

    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:700,system:SYSTEM_PROMPT,
          messages:[...history.current.slice(-14),{role:"user",content:ctx+"\n\nAction: "+txt}]})
      });
      const data=await res.json();
      if(data.error) throw new Error(data.error.message);
      const raw=data.content?.map(b=>b.text||"").join("\n")||"";

      let delta={roll:null,success:null,hpChange:0,staminaChange:0,rageChange:0,goldChange:0,xpGain:0,hungerChange:undefined,thirstChange:undefined,tempChange:undefined,event:null,enemyHp:null,enemyName:null,locationChange:null,lootItem:null};
      let narrative=raw;
      const jm=raw.match(/```json\s*([\s\S]*?)```/);
      if(jm){try{delta={...delta,...JSON.parse(jm[1])};}catch{} narrative=raw.replace(/```json[\s\S]*?```/,"").trim();}

      // ── OVERRIDE COMBAT AVEC VALEURS CLIENT-SIDE ──────────────
      if(inCombat && clientDmg){
        // On force les vrais dégâts calculés côté client
        delta.roll    = clientRoll;
        delta.success = clientRoll >= 51;
        delta.hpChange = clientDmg.playerDmg; // négatif si dégâts reçus
        // Mise à jour ennemi avec les vrais dégâts
        const newEHp = clientDmg.newEnemyHp;
        const eName  = enemy.name;
        if(newEHp <= 0){
          setEnemy(null);
          delta.xpGain = (delta.xpGain||0) + 20 + Math.floor(Math.random()*20);
          showNotif("☠️ "+eName+" vaincu !","#cc4444");
        } else {
          setEnemy({name:eName, hp:newEHp});
        }
      } else {
        // Hors combat — gestion normale de l'ennemi si Claude en crée un
        if(delta.event==="combat" && delta.enemyName && !enemy){
          setEnemy({name:delta.enemyName, hp:delta.enemyHp??100});
        }
      }

      // Son adaptatif
      const newHp=Math.max(0,Math.min(char.hpMax,(char.hp||0)+(delta.hpChange||0)));
      const nextMode=inCombat?"combat":delta.event==="rest"?"rest":newHp/char.hpMax<0.25?"danger":"explore";
      updateSound(nextMode,newHp,char.hpMax);

      // Notifs
      if(delta.hpChange<0)     showNotif("💔 "+delta.hpChange+" PV","#cc2222");
      if(delta.hpChange>0)     showNotif("❤️ +"+delta.hpChange+" PV","#44cc77");
      if(delta.goldChange>0)   showNotif("💰 +"+delta.goldChange+" or","#ffd700");
      if(delta.goldChange<0)   showNotif("💰 "+delta.goldChange+" or","#aa6622");
      if(delta.xpGain>0)       showNotif("✨ +"+delta.xpGain+" XP","#aaddff");
      if(delta.lootItem)       showNotif((delta.lootItem.icon||"📦")+" "+delta.lootItem.name,"#c8a040");
      if(inCombat && clientDmg && clientDmg.enemyDmg>0) showNotif("⚔️ -"+clientDmg.enemyDmg+" PV ennemi","#ee6622");

      setChar(p=>applyDelta(delta,p));
      // Toujours afficher le dé client (c'est lui qui a été transmis à Claude)
      const rc=clientRoll>=80?"#ffd700":clientRoll<=20?"#ff3333":clientRoll>=51?"#44cc77":"#cc4444";
      const rl=clientRoll>=80?"CRITIQUE!":clientRoll<=20?"DÉSASTRE!":clientRoll>=51?"SUCCÈS":"ÉCHEC";
      setMessages(p=>[...p,{role:"assistant",text:narrative,roll:clientRoll,success:clientRoll>=51,rc,rl}]);
      history.current.push({role:"assistant",content:narrative});
      setTab("journal");
    }catch(e){
      setMessages(p=>[...p,{role:"assistant",text:"⚠️ Erreur : "+e.message,roll:null}]);
    }
    setLoad(false);
  };

  const useSkill=sk=>{
    if(sk.type==="rage"&&char.rage<sk.cost){showNotif("Rage insuffisante !","#cc4444");return;}
    if(sk.type==="stamina"&&char.stamina<sk.cost){showNotif("Endurance insuffisante !","#cc4444");return;}
    setInput("J'utilise "+sk.name+" — "+sk.desc);
    setTab("journal");
  };

  const useConsumable=(item)=>{
    // Vérification dans le char courant avant de muter
    const currentItem = char.inventory.find(i=>i.name===item.name);
    if(!currentItem||currentItem.qty<=0){
      showNotif("Plus de "+item.name+" !","#cc4444");
      return;
    }
    let hp=0,hunger=0,thirst=0;
    if(item.type==="consumable") hp=40;
    if(item.type==="food")       hunger=35;
    if(item.type==="water")      thirst=45;
    // Notif hors setter — pas de side-effect dans fonction pure
    if(item.type==="consumable") showNotif("❤️ +40 PV","#44cc77");
    else if(item.type==="food")  showNotif("🍖 +35 Faim","#cc8833");
    else if(item.type==="water") showNotif("💧 +45 Soif","#3388cc");
    // Double guard dans setter pour protéger contre les doubles appels React
    setChar(p=>{
      const c=p.inventory.find(i=>i.name===item.name);
      if(!c||c.qty<=0) return p;
      return {...p,
        hp:     clamp(p.hp+hp,         0, p.hpMax),
        hunger: clamp(p.hunger+hunger,  0, p.hungerMax),
        thirst: clamp(p.thirst+thirst,  0, p.thirstMax),
        inventory: p.inventory
          .map(i=>i.name===item.name ? {...i,qty:i.qty-1} : i)
          .filter(i=>i.qty>0)
      };
    });
  };

  // Jeter un item de l'inventaire
  const dropItem=(itemName)=>{
    const item = char.inventory.find(i=>i.name===itemName);
    if(!item) return;
    if(!window.confirm(`Jeter ${item.qty>1?item.qty+"× ":""}${itemName} ?`)) return;
    setChar(p=>({...p, inventory:p.inventory.filter(i=>i.name!==itemName)}));
    showNotif("🗑 Jeté : "+itemName,"#7a5020");
  };

  // Récupération d'inconscience — Bjorn reprend conscience lentement
  const wakeUp=()=>{
    setChar(p=>{
      const sta=clamp(p.stamina+18,0,p.staminaMax);
      return {...p,stamina:sta,unconscious:sta>0?false:true};
    });
    showNotif("💤 Bjorn reprend conscience...","#aaaaff");
    setMessages(prev=>[...prev,{role:"assistant",text:"Bjorn reprend lentement conscience, épuisé. Son corps refuse de le laisser mourir — pour l'instant. Il parvient à se relever, chancelant. Que fais-tu ?",roll:null}]);
    if(soundOnRef.current) SE.play("explore",char.hp/char.hpMax);
  };

  // ══ ÉCRAN CLÉ API ════════════════════════════════════════════════════════════
  if(!keySet) return(
    <div style={{height:"100%",background:"#0a0704",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"'EB Garamond',serif"}}>
      <div style={{fontSize:22,fontFamily:"'Cinzel',serif",color:"#c8862a",letterSpacing:2,textAlign:"center",marginBottom:6}}>⚔ SURVIVING<br/>THE DUNGEON</div>
      <div style={{fontSize:11,color:"#7a5030",letterSpacing:3,marginBottom:32,textAlign:"center"}}>AS A BARBARIAN</div>
      <div style={{width:"100%",maxWidth:360}}>
        <div style={{fontSize:13,color:"#a89070",marginBottom:8}}>Clé API Anthropic :</div>
        <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} onKeyDown={e=>e.key==="Enter"&&apiKey&&saveKey()} placeholder="sk-ant-..."
          style={{width:"100%",background:"#120a02",border:"1px solid #3a2010",borderRadius:8,color:"#d4b896",padding:"12px 14px",fontSize:14,marginBottom:12,outline:"none"}}/>
        <div style={{fontSize:11,color:"#5a3818",marginBottom:20,lineHeight:1.7}}>
          <a href="https://console.anthropic.com" target="_blank" style={{color:"#c8862a"}}>console.anthropic.com</a> → API Keys → Billing ($5 min)
        </div>
        <button onClick={saveKey} disabled={!apiKey}
          style={{width:"100%",background:apiKey?"linear-gradient(135deg,#8a4a10,#c8762a)":"#1a0e04",border:"1px solid #c8762a",borderRadius:10,color:"#ffd4a0",padding:"13px",cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:14,letterSpacing:2}}>
          ENTRER DANS LE DONJON
        </button>
      </div>
    </div>
  );

  const mal=getSurvivalMalus(char);
  const warnings=getSurvivalStatus(char);
  const isDanger=char.hp/char.hpMax<0.25||char.hunger<20||char.thirst<20||char.temp<0||char.temp>40;

  // ══ ÉCRAN DE DÉMARRAGE ═══════════════════════════════════════════════════════
  if(screen==="start"){
    const s=loadSave();
    const savedAt=s?.savedAt ? new Date(s.savedAt) : null;
    const savedStr=savedAt ? savedAt.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—";
    const sc=s?.char||INITIAL_CHAR;
    return(
      <div style={{height:"100%",background:"#0a0704",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,fontFamily:"'EB Garamond',serif"}}>
        <div style={{fontSize:22,fontFamily:"'Cinzel',serif",color:"#c8862a",letterSpacing:2,textAlign:"center",marginBottom:4}}>⚔ SURVIVING<br/>THE DUNGEON</div>
        <div style={{fontSize:10,color:"#7a5030",letterSpacing:3,marginBottom:28,textAlign:"center"}}>AS A BARBARIAN</div>

        <div style={{width:"100%",maxWidth:360,background:"#0e0a02",border:"1px solid #3a2010",borderRadius:12,padding:"18px 20px",marginBottom:20}}>
          <div style={{fontSize:10,color:"#5a3818",fontFamily:"'Cinzel',serif",letterSpacing:2,marginBottom:12}}>▸ SAUVEGARDE</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            {[
              {label:"Personnage",val:sc.name+" Nv."+sc.level},
              {label:"Lieu",      val:sc.location},
              {label:"PV",        val:sc.hp+"/"+sc.hpMax},
              {label:"Or",        val:sc.gold+"g"},
              {label:"Jour",      val:"J"+sc.day+" M"+sc.month},
              {label:"Sauvé le",  val:savedStr},
            ].map((r,i)=>(
              <div key={i} style={{background:"#120a02",border:"1px solid #2a1808",borderRadius:6,padding:"6px 10px"}}>
                <div style={{fontSize:9,color:"#5a3818",letterSpacing:1}}>{r.label}</div>
                <div style={{fontSize:12,color:"#d4a870"}}>{r.val}</div>
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:8,marginTop:8}}>
            <button onClick={loadGame}
              style={{flex:2,background:"linear-gradient(135deg,#0a3010,#1a5020)",border:"1px solid #44aa66",borderRadius:8,color:"#88dd99",padding:"11px",cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:13,letterSpacing:1}}>
              ▶ Continuer
            </button>
            <button onClick={deleteSave}
              style={{flex:1,background:"#100404",border:"1px solid #5a1010",borderRadius:8,color:"#884444",padding:"11px",cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:11}}>
              🗑 Supprimer
            </button>
          </div>
        </div>

        <button onClick={()=>{localStorage.removeItem(SAVE_KEY);setChar(INITIAL_CHAR);setMessages(INIT_MSG);history.current=[];setEnemy(null);setDead(false);setUnconscious(false);setScreen("game");}}
          style={{width:"100%",maxWidth:360,background:"#1a0e04",border:"1px solid #3a2010",borderRadius:8,color:"#7a5030",padding:"10px",cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:11,letterSpacing:1}}>
          + Nouvelle partie (efface la save)
        </button>
      </div>
    );
  }

  // ══ UI PRINCIPALE ════════════════════════════════════════════════════════════
  return(
    <div style={{height:"100%",display:"flex",flexDirection:"column",background:"#0a0704",fontFamily:"'EB Garamond',serif",color:"#d4b896",overflow:"hidden",animation:isDanger?"danger 2s infinite":undefined}}>

      {notif&&<div style={{position:"fixed",top:16,left:"50%",transform:"translateX(-50%)",background:"#0e0802",border:"1px solid "+notif.color,borderRadius:20,padding:"6px 18px",fontFamily:"'Cinzel',serif",fontSize:13,color:notif.color,zIndex:999,pointerEvents:"none",whiteSpace:"nowrap",animation:"fadeNotif 2.6s ease forwards"}}>{notif.text}</div>}

      {newSkill&&<div style={{position:"fixed",bottom:85,left:"50%",transform:"translateX(-50%)",background:"#1a0e02",border:"2px solid #c8862a",borderRadius:12,padding:"12px 20px",zIndex:998,animation:"slideIn 0.4s ease",maxWidth:"80%",textAlign:"center"}}>
        <div style={{fontSize:10,color:"#c8862a",fontFamily:"'Cinzel',serif",letterSpacing:2,marginBottom:4}}>✦ COMPÉTENCE DÉBLOQUÉE</div>
        <div style={{fontSize:15,color:"#e8d080",fontFamily:"'Cinzel',serif"}}>{newSkill.name}</div>
        <div style={{fontSize:11,color:"#7a5030",marginTop:3}}>{newSkill.desc}</div>
      </div>}

      {/* ── TOP BAR ─────────────────────────────────────────────────────────── */}
      <div style={{background:"#0e0a02",borderBottom:"1px solid "+(isDanger?"#5a1010":"#2a1808"),padding:"7px 12px",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:5}}>
          <span style={{fontFamily:"'Cinzel',serif",fontSize:14,color:"#e8a84a"}}>{char.name}</span>
          <span style={{background:"#2a1608",border:"1px solid #c8862a",color:"#c8862a",borderRadius:4,padding:"0 6px",fontSize:9,fontFamily:"'Cinzel',serif"}}>Nv.{char.level}</span>
          {enemy&&<span style={{background:"#2a0404",border:"1px solid #cc3333",color:"#ee4444",borderRadius:4,padding:"0 6px",fontSize:9,fontFamily:"'Cinzel',serif"}}>⚔ COMBAT</span>}
          {char.unconscious&&<span style={{background:"#0a0a2a",border:"1px solid #aaaaff",color:"#aaaaff",borderRadius:4,padding:"0 6px",fontSize:9,fontFamily:"'Cinzel',serif",animation:"pulse 1s infinite"}}>💤 INCONSCIENT</span>}
          <span style={{marginLeft:"auto",fontSize:10,color:"#7a6030",fontFamily:"'Cinzel',serif"}}>J{char.day} M{char.month} | {String(char.hour).padStart(2,"0")}h</span>
          <span style={{fontSize:11,color:"#aa8822"}}>💰{char.gold}g</span>
          <TempBadge temp={char.temp}/>
          <button onClick={toggleSound} style={{background:"transparent",border:"1px solid #2a1808",borderRadius:6,color:soundOn?"#c8862a":"#3a2808",padding:"2px 7px",cursor:"pointer",fontSize:12}}>
            {soundOn?"🔊":"🔇"}
          </button>
          <button onClick={manualSave} style={{background:saveFlash?"#0a2010":"transparent",border:"1px solid "+(saveFlash?"#44aa66":"#2a1808"),borderRadius:6,color:saveFlash?"#44aa66":"#3a2808",padding:"2px 7px",cursor:"pointer",fontSize:11}}>
            {saveFlash?"✓":"💾"}
          </button>
        </div>

        {/* Barres PV/END/RAGE */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:5,marginBottom:4}}>
          {[
            {val:char.hp,max:char.hpMax,color:"hsl("+(char.hp/char.hpMax*120)+",80%,30%)",icon:"❤",label:char.hp+"/"+char.hpMax},
            {val:char.stamina,max:char.staminaMax,color:"#1a77bb",icon:"⚡",label:char.stamina+"/"+char.staminaMax},
            {val:char.rage,max:char.rageMax,color:"#cc5500",icon:"🔥",label:char.rage+"/"+char.rageMax},
          ].map((b,i)=>(
            <div key={i}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:"#5a3818",marginBottom:1}}>
                <span>{b.icon}</span><span style={{color:b.val/b.max<0.25?"#ff4444":"inherit"}}>{b.label}</span>
              </div>
              <div style={{height:5,background:"#1a1208",borderRadius:2,overflow:"hidden"}}>
                <div style={{height:"100%",width:Math.max(0,Math.min(100,b.val/b.max*100))+"%",background:b.color,transition:"width 0.4s",borderRadius:2}}/>
              </div>
            </div>
          ))}
        </div>

        {/* Barres SURVIE */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5}}>
          {[
            {val:char.hunger,max:char.hungerMax,color:char.hunger<40?"#cc4422":"#885522",icon:"🍖",label:"Faim "+char.hunger+"%"},
            {val:char.thirst,max:char.thirstMax,color:char.thirst<40?"#2244cc":"#224488",icon:"💧",label:"Soif "+char.thirst+"%"},
          ].map((b,i)=>(
            <div key={i}>
              <div style={{display:"flex",justifyContent:"space-between",fontSize:9,color:b.val<40?"#cc5533":"#5a3818",marginBottom:1}}>
                <span>{b.icon}</span><span>{b.label}</span>
              </div>
              <div style={{height:4,background:"#1a1208",borderRadius:2,overflow:"hidden"}}>
                <div style={{height:"100%",width:Math.max(0,b.val)+"%",background:b.color,transition:"width 0.4s",borderRadius:2}}/>
              </div>
            </div>
          ))}
        </div>

        {/* Warnings survie */}
        {warnings.length>0&&<div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:5}}>
          {warnings.map((w,i)=>(
            <span key={i} style={{fontSize:9,color:w.color,background:w.color+"11",border:"1px solid "+w.color+"44",borderRadius:4,padding:"1px 6px",fontFamily:"'Cinzel',serif",animation:w.blink?"pulse 1s infinite":undefined}}>{w.text}</span>
          ))}
        </div>}

        {/* Malus actifs */}
        {(mal.forMod<0||mal.agiMod<0||mal.endMod<0)&&<div style={{fontSize:9,color:"#884422",marginTop:3}}>
          ⬇ Malus actifs : {mal.forMod<0?"FOR "+mal.forMod+" ":""}{mal.agiMod<0?"AGI "+mal.agiMod+" ":""}{mal.endMod<0?"END "+mal.endMod:""}
        </div>}

        {/* XP */}
        <div style={{marginTop:4,height:3,background:"#150a18",borderRadius:2,overflow:"hidden"}}>
          <div style={{height:"100%",width:Math.min(100,(char.xp/char.xpNext)*100)+"%",background:"#8844cc",transition:"width 0.5s",borderRadius:2}}/>
        </div>
        <div style={{fontSize:8,color:"#4a2868",marginTop:1,textAlign:"right"}}>XP {char.xp}/{char.xpNext}</div>
      </div>

      {/* ── CONTENT ─────────────────────────────────────────────────────────── */}
      <div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column",minHeight:0}}>

        {tab==="journal"&&(
          <div style={{flex:1,overflowY:"auto",padding:"10px 12px",display:"flex",flexDirection:"column",gap:10}}>
            {messages.map((m,i)=>(
              <div key={i} style={{alignSelf:m.role==="user"?"flex-end":"flex-start",background:m.role==="user"?"#1a0e04":"#0e0a02",border:"1px solid "+(m.role==="user"?"#3a2010":"#221408"),borderRadius:m.role==="user"?"12px 12px 3px 12px":"12px 12px 12px 3px",padding:"10px 13px",maxWidth:"88%",fontSize:14,lineHeight:1.85,color:m.role==="user"?"#c89060":"#c4a880"}}>
                {m.role==="assistant"&&<div style={{fontSize:9,color:"#5a3818",marginBottom:5,letterSpacing:2,display:"flex",alignItems:"center",flexWrap:"wrap",gap:6}}>
                  ⚔ MAÎTRE DU DONJON
                  {m.roll&&<span style={{background:m.rc+"22",border:"1px solid "+m.rc,color:m.rc,borderRadius:4,padding:"0 6px",fontSize:9}}>🎲{m.roll} — {m.rl}</span>}
                </div>}
                <div style={{whiteSpace:"pre-wrap"}}>{m.text}</div>
              </div>
            ))}
            {loading&&<div style={{alignSelf:"flex-start",background:"#0e0a02",border:"1px solid #221408",borderRadius:"12px 12px 12px 3px",padding:"10px 13px",animation:"pulse 1s infinite"}}>
              <div style={{fontSize:9,color:"#5a3818",marginBottom:4,letterSpacing:2}}>⚔ MAÎTRE DU DONJON</div>
              <span style={{color:"#3a2808"}}>Le donjon murmure...</span>
            </div>}
            <div ref={endRef}/>
          </div>
        )}

        {tab==="perso"&&(
          <div style={{flex:1,overflowY:"auto",padding:"13px"}}>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:"#5a3818",letterSpacing:3,marginBottom:8}}>▸ STATISTIQUES</div>
            <StatBar value={char.hp}      max={char.hpMax}      color="#cc3333" label="VIE"        icon="❤" warn/>
            <StatBar value={char.stamina} max={char.staminaMax} color="#2288cc" label="ENDURANCE"  icon="⚡" warn/>
            <StatBar value={char.rage}    max={char.rageMax}    color="#dd6611" label="RAGE"        icon="🔥"/>
            <StatBar value={char.xp}      max={char.xpNext}     color="#8844cc" label="EXPÉRIENCE" icon="✦"/>

            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:"#5a3818",letterSpacing:3,margin:"12px 0 8px"}}>▸ SURVIE</div>
            <StatBar value={char.hunger} max={char.hungerMax} color={char.hunger<40?"#cc4422":"#885522"} label={"FAIM (malus FOR "+mal.forMod+")"} icon="🍖" warn/>
            <StatBar value={char.thirst} max={char.thirstMax} color={char.thirst<40?"#2244cc":"#224488"} label={"SOIF (malus AGI "+mal.agiMod+")"} icon="💧" warn/>
            <div style={{background:"#0e0a02",border:"1px solid #2a1808",borderRadius:8,padding:"8px 12px",fontSize:12,marginBottom:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <TempBadge temp={char.temp}/>
              <span style={{fontSize:10,color:"#5a3818"}}>{char.temp<5?"Gelé — drain PV/END":char.temp>35?"Surchauffé — drain soif/PV":"Température normale"}</span>
            </div>

            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:"#5a3818",letterSpacing:3,margin:"12px 0 8px"}}>▸ ATTRIBUTS {(mal.forMod<0||mal.agiMod<0)&&<span style={{color:"#cc4422",fontSize:9}}>(malus actifs)</span>}</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginBottom:14}}>
              {Object.entries(char.stats).map(([k,v])=>{
                const mod = k==="FOR"?mal.forMod:k==="AGI"?mal.agiMod:k==="END"?mal.endMod:0;
                return(
                  <div key={k} style={{background:"#120a02",border:"1px solid "+(mod<0?"#4a1808":"#2a1808"),borderRadius:8,padding:"9px 6px",textAlign:"center"}}>
                    <div style={{fontSize:20,color:mod<0?"#ee6633":"#e8c070",fontFamily:"'Cinzel',serif"}}>{v+mod}</div>
                    <div style={{fontSize:9,color:"#6a4828",letterSpacing:1}}>{k}{mod<0&&<span style={{color:"#cc4422"}}> ({mod})</span>}</div>
                  </div>
                );
              })}
            </div>

            {(()=>{
              const totalW=calcWeight(char.inventory);
              const maxW=maxCarry(char.stats.FOR);
              const wPct=Math.min(100,(totalW/maxW)*100);
              const wColor=wPct>100?"#ff6622":wPct>85?"#ffaa22":"#6a9a44";
              return(<>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                  <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:"#5a3818",letterSpacing:3}}>▸ INVENTAIRE</div>
                  <div style={{fontSize:10,color:wColor,fontFamily:"'Cinzel',serif"}}>⚖ {totalW.toFixed(1)}/{maxW.toFixed(0)}kg</div>
                </div>
                {char.inventory.length>0&&(
                  <div style={{height:4,background:"#1a1208",borderRadius:2,overflow:"hidden",marginBottom:8}}>
                    <div style={{height:"100%",width:Math.min(100,wPct)+"%",background:wColor,transition:"width 0.4s",borderRadius:2}}/>
                  </div>
                )}
              </>);
            })()}
            {char.inventory.length===0
              ?<div style={{background:"#0a0804",border:"1px dashed #2a1808",borderRadius:8,padding:"14px",textAlign:"center",color:"#3a2808",fontSize:12,fontStyle:"italic",marginBottom:12}}>Vide — explore pour trouver eau, nourriture et équipement.</div>
              :<div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:12}}>
                {char.inventory.map((it)=>{
                  const w=(typeof it.weight==="number"?it.weight:(WEIGHT_DEFAULTS[it.type]||1.0));
                  return(
                  <div key={it.name} style={{background:"#0e0a02",border:"1px solid #2a1808",borderRadius:10,padding:"8px 12px",display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:18}}>{it.icon||"📦"}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,color:"#d4a870",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{it.name}</div>
                      <div style={{fontSize:9,color:"#5a3818",letterSpacing:1}}>{(it.type||"misc").toUpperCase()} ×{it.qty} · {(w*it.qty).toFixed(1)}kg</div>
                    </div>
                    <div style={{display:"flex",gap:5,flexShrink:0}}>
                      {(it.type==="consumable"||it.type==="food"||it.type==="water")&&it.qty>0&&(
                        <button onClick={()=>useConsumable(it)}
                          style={{background:"#0a0e04",border:"1px solid #2a4010",borderRadius:6,color:"#88cc44",padding:"4px 7px",cursor:"pointer",fontSize:11}}>
                          ✓
                        </button>
                      )}
                      <button onClick={()=>dropItem(it.name)}
                        style={{background:"#100804",border:"1px solid #3a1808",borderRadius:6,color:"#7a4422",padding:"4px 7px",cursor:"pointer",fontSize:11}}>
                        🗑
                      </button>
                    </div>
                  </div>
                );})}
              </div>
            }

            <div style={{background:"#0e0802",border:"1px solid #2a1808",borderRadius:8,padding:"8px 12px",fontSize:12,color:"#a87848",fontStyle:"italic",marginBottom:12}}>
              📍 {char.location} — Étage {char.floor}
            </div>

            <div style={{display:"flex",gap:8,marginBottom:8}}>
              <button onClick={manualSave} style={{flex:1,background:"#04100a",border:"1px solid #1a4020",borderRadius:8,color:"#44aa66",padding:"9px",cursor:"pointer",fontSize:11,fontFamily:"'Cinzel',serif"}}>💾 Sauvegarder</button>
              <button onClick={resetGame}  style={{flex:1,background:"#100404",border:"1px solid #3a1010",borderRadius:8,color:"#884444",padding:"9px",cursor:"pointer",fontSize:11,fontFamily:"'Cinzel',serif"}}>🔄 Recommencer</button>
            </div>
            <button onClick={()=>setScreen("start")}
              style={{width:"100%",background:"#080c10",border:"1px solid #1a2a3a",borderRadius:8,color:"#4466aa",padding:"9px",cursor:"pointer",fontSize:11,fontFamily:"'Cinzel',serif",marginBottom:6}}>
              📂 Menu sauvegardes
            </button>
            <button onClick={()=>{localStorage.removeItem(APIKEY_KEY);setKeySet(false);setApiKey("");}}
              style={{width:"100%",background:"#0a0808",border:"1px solid #2a1010",borderRadius:8,color:"#5a3030",padding:"8px",cursor:"pointer",fontSize:10,fontFamily:"'Cinzel',serif",marginBottom:4}}>
              🔑 Changer la clé API
            </button>
          </div>
        )}

        {tab==="skills"&&(
          <div style={{flex:1,overflowY:"auto",padding:"12px",display:"flex",flexDirection:"column",gap:7}}>
            {enemy&&<div style={{background:"#160404",border:"1px solid #5a1010",borderRadius:10,padding:"11px",marginBottom:4}}>
              <div style={{fontSize:12,color:"#e84040",fontFamily:"'Cinzel',serif",marginBottom:7}}>☠ COMBAT — {enemy.name}</div>
              <StatBar value={enemy.hp} max={100} color="#cc2222" label="PV ENNEMI" icon="💀" warn/>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7,marginTop:7}}>
                <button onClick={()=>{setInput("J'attaque "+enemy.name+" de toutes mes forces !");setTab("journal");}}
                  style={{background:"#2a0404",border:"1px solid #6a1010",borderRadius:8,color:"#ee4444",padding:"9px",cursor:"pointer",fontSize:13}}>⚔ Attaquer</button>
                <button onClick={()=>{setInput("Je tente de fuir le combat contre "+enemy.name+" !");setTab("journal");}}
                  style={{background:"#1a1404",border:"1px solid #4a3810",borderRadius:8,color:"#aa8844",padding:"9px",cursor:"pointer",fontSize:13}}>🏃 Fuir</button>
              </div>
            </div>}

            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:"#5a3818",letterSpacing:3}}>▸ COMPÉTENCES</div>
            {char.skills.length===0
              ?<div style={{background:"#0a0804",border:"1px dashed #2a1808",borderRadius:10,padding:"18px",textAlign:"center",color:"#3a2808",fontSize:12,fontStyle:"italic"}}>Aucune compétence — monte de niveau pour en débloquer.</div>
              :char.skills.map((sk,i)=>{
                const dis=sk.type==="rage"?char.rage<sk.cost:char.stamina<sk.cost;
                return(
                  <button key={i} onClick={()=>useSkill(sk)} disabled={dis}
                    style={{background:dis?"#0a0804":"#120a02",border:"1px solid "+(dis?"#1e1408":"#4a2c10"),borderRadius:10,padding:"11px 12px",cursor:dis?"not-allowed":"pointer",color:dis?"#3a2808":"#c89060",fontSize:13,textAlign:"left",width:"100%",opacity:dis?0.5:1}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:3}}>
                      <span style={{fontWeight:600,fontFamily:"'Cinzel',serif",fontSize:11}}>{sk.name}</span>
                      <span style={{fontSize:10,color:sk.type==="rage"?"#dd6611":"#2288cc"}}>-{sk.cost} {sk.type==="rage"?"🔥":"⚡"}</span>
                    </div>
                    <div style={{fontSize:11,color:"#6a4828"}}>{sk.desc}</div>
                    {sk.dmg!=="—"&&<div style={{fontSize:10,color:"#aa6622",marginTop:2}}>🗡 {sk.dmg}</div>}
                  </button>
                );
              })
            }

            <div style={{fontFamily:"'Cinzel',serif",fontSize:10,color:"#5a3818",letterSpacing:3,marginTop:4}}>▸ ACTIONS</div>
            {[
              {label:"🌙 Se reposer (récupère END — sans consommer faim/soif)",action:()=>{setInput("Je cherche un endroit sûr pour me reposer.");setTab("journal");},bc:"#101830",tc:"#4488aa"},
              {label:"🗺 Explorer les alentours",action:()=>{setInput("J'explore prudemment les alentours à la recherche de nourriture, eau ou équipement.");setTab("journal");},bc:"#302810",tc:"#aa9944"},
              {label:"👁 Inspecter la zone",action:()=>{setInput("J'inspecte la zone pour repérer pièges, ennemis et ressources cachées.");setTab("journal");},bc:"#102028",tc:"#4499aa"},
              {label:"🗣 Chercher un marchand ou PNJ",action:()=>{setInput("Je cherche un marchand, un survivant ou toute autre présence humaine dans les environs.");setTab("journal");},bc:"#201030",tc:"#8866aa"},
            ].map((a,i)=>(
              <button key={i} onClick={a.action}
                style={{background:"#0e0a02",border:"1px solid "+a.bc,borderRadius:10,color:a.tc,padding:"10px 12px",cursor:"pointer",fontSize:13,textAlign:"left"}}>
                {a.label}
              </button>
            ))}

            <div style={{background:"#0a0a08",border:"1px solid #1e1e10",borderRadius:8,padding:"9px 12px",marginTop:2}}>
              <div style={{fontSize:9,color:"#4a3808",fontFamily:"'Cinzel',serif",letterSpacing:2,marginBottom:5}}>▸ RÈGLES DE SURVIE</div>
              <div style={{fontSize:11,color:"#4a3808",lineHeight:1.9}}>
                🍖 Faim 0% → -5 PV/action<br/>
                💧 Soif 0% → -8 PV/action + stamina=0<br/>
                🥶 Temp &lt;0°C → -6 PV/action<br/>
                🔥 Temp &gt;40°C → -4 PV + soif rapide<br/>
                🎲 D100 : 80+=Crit | 51-79=Succès | 21-50=Échec | ≤20=Désastre
              </div>
            </div>
          </div>
        )}
      </div>

      {/* ── INPUT ───────────────────────────────────────────────────────────── */}
      {tab==="journal"&&(
        <div style={{padding:"7px 10px",background:"#0a0702",borderTop:"1px solid #1e1208",flexShrink:0,display:"flex",gap:7}}>
          <input ref={inputRef}
            style={{flex:1,background:"#120a02",border:"1px solid "+(dead?"#5a1010":"#3a2010"),borderRadius:10,color:dead?"#5a2020":"#d4b896",padding:"10px 12px",fontSize:14,outline:"none"}}
            value={input} onChange={e=>setInput(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&!e.shiftKey&&send()}
            placeholder={dead?"☠ Bjorn est mort. Recommence.":char.unconscious?"💤 Bjorn est inconscient — il doit récupérer...":"Que fais-tu, barbare ?"} disabled={loading||dead||char.unconscious}/>
          <button
            onClick={dead?resetGame:char.unconscious?wakeUp:send}
            disabled={loading&&!dead&&!char.unconscious}
            style={{background:dead?"#3a0404":char.unconscious?"#0a0a2a":loading?"#1a0e04":"linear-gradient(135deg,#8a4a10,#c8762a)",border:"1px solid "+(dead?"#aa2222":char.unconscious?"#aaaaff":"#c8762a"),borderRadius:10,color:"#ffd4a0",padding:"10px 14px",cursor:"pointer",fontFamily:"'Cinzel',serif",fontSize:11,letterSpacing:1,flexShrink:0}}>
            {dead?"↺":char.unconscious?"💤 Récupérer":loading?"...":"AGIR"}
          </button>
        </div>
      )}

      {/* ── NAV ─────────────────────────────────────────────────────────────── */}
      <div style={{display:"flex",background:"#0c0804",borderTop:"1px solid #2a1808",flexShrink:0}}>
        {[{id:"journal",icon:"📜",label:"Journal"},{id:"skills",icon:"⚔️",label:"Capacités"},{id:"perso",icon:"🧍",label:"Personnage"}].map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            style={{flex:1,background:"transparent",border:"none",borderTop:"2px solid "+(tab===t.id?"#c8762a":"transparent"),padding:"8px 4px 6px",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
            <span style={{fontSize:19}}>{t.icon}</span>
            <span style={{fontSize:9,color:tab===t.id?"#c8762a":"#4a2808",fontFamily:"'Cinzel',serif",letterSpacing:1}}>{t.label}</span>
          </button>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
